name: NYC world and vehicle regression checks

on:
  push:
    branches:
      - feat/nyc-world-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyc-world-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Bake live NYC roads, building footprints and NYC 2017 DEM terrain
        id: nyc_bake
        run: npm run bake:nyc:world
        continue-on-error: true

      - name: Retain baked NYC road data
        if: steps.nyc_bake.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyc-gis-world-${{ github.sha }}
          path: |
            public/data/nyc/nyc-street-network.json
            public/data/nyc/manifest.json
            public/data/nyc/tiles/
            public/data/nyc/buildings/
            public/data/nyc/terrain/
          retention-days: 14
          if-no-files-found: error
      - name: Validate NYC 2017 DEM tile integrity and coverage
        id: nyc_terrain
        if: always() && steps.nyc_bake.outcome == 'success'
        run: npm run test:nyc-terrain
        continue-on-error: true

      - name: TypeScript and production build
        id: build
        if: always() && steps.nyc_bake.outcome == 'success'
        run: npm run build:app
        continue-on-error: true

      - name: Validate baked NYC CSCL directed road graph
        id: nyc_graph
        if: always() && steps.nyc_bake.outcome == 'success'
        run: npm run test:nyc-road-graph
        continue-on-error: true

      - name: Drivetrain and vehicle physics regressions
        id: drivetrain
        if: always()
        run: npm run test:drivetrain
        continue-on-error: true

      - name: NYC geospatial regressions
        id: nyc_geo
        if: always()
        run: npm run test:nyc-geo
        continue-on-error: true

      - name: NYC district and spatial placement regressions
        id: city_urban
        if: always()
        run: npm run test:city-urban
        continue-on-error: true

      - name: City graph and routing regressions
        id: city_routing
        if: always()
        run: npm run test:city-routing
        continue-on-error: true

      - name: Combined world regressions
        id: world
        if: always()
        run: npm run test:world
        continue-on-error: true

      - name: Enforce all check results
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          DRIVETRAIN_RESULT: ${{ steps.drivetrain.outcome }}
          NYC_GEO_RESULT: ${{ steps.nyc_geo.outcome }}
          CITY_URBAN_RESULT: ${{ steps.city_urban.outcome }}
          CITY_ROUTING_RESULT: ${{ steps.city_routing.outcome }}
          WORLD_RESULT: ${{ steps.world.outcome }}
          NYC_BAKE_RESULT: ${{ steps.nyc_bake.outcome }}
          NYC_GRAPH_RESULT: ${{ steps.nyc_graph.outcome }}
          NYC_TERRAIN_RESULT: ${{ steps.nyc_terrain.outcome }}
        run: |
          printf 'build: %s\n' "$BUILD_RESULT"
          printf 'test:drivetrain: %s\n' "$DRIVETRAIN_RESULT"
          printf 'test:nyc-geo: %s\n' "$NYC_GEO_RESULT"
          printf 'test:city-urban: %s\n' "$CITY_URBAN_RESULT"
          printf 'test:city-routing: %s\n' "$CITY_ROUTING_RESULT"
          printf 'test:world: %s\n' "$WORLD_RESULT"
          printf 'bake:nyc:world: %s\n' "$NYC_BAKE_RESULT"
          test "$BUILD_RESULT" = success
          test "$DRIVETRAIN_RESULT" = success
          test "$NYC_GEO_RESULT" = success
          test "$CITY_URBAN_RESULT" = success
          test "$CITY_ROUTING_RESULT" = success
          test "$WORLD_RESULT" = success
          printf 'test:nyc-road-graph: %s\\n' "$NYC_GRAPH_RESULT"
          printf 'test:nyc-terrain: %s\\n' "$NYC_TERRAIN_RESULT"
          test "$BUILD_RESULT" = success
          test "$NYC_BAKE_RESULT" = success
          test "$NYC_GRAPH_RESULT" = success
          test "$NYC_TERRAIN_RESULT" = success
