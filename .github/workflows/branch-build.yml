name: Branch build validation

on:
  push:
    branches:
      - fix/vehicle-movement
      - feat/nyc-world-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run Rapier drivetrain regression simulation
        run: npm run test:drivetrain

      - name: Run NYC geospatial regression simulation
        run: npm run test:nyc-geo

      - name: Run city graph, streaming and traffic integration regression
        run: npm run test:city-routing
